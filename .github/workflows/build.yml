name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Node.js Kur (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Java JDK Kur (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Paketleri Yukle
        run: npm install

      - name: Android Klasorunu/Wrapper'i Tamamla
        run: npx react-native eject || true

      - name: Gradlew Yetkisi Ver
        run: |
          cd android
          chmod +x gradlew || true

      - name: APK Derle (React Native Gradle)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon || gradle assembleRelease --no-daemon

      - name: APK Dosyasini Hazirla
        uses: actions/upload-artifact@v4
        with:
          name: HeartBeat-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
