name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Java JDK Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Paketleri Yukle
        run: npm install

      - name: Android Klasorunu Sifirdan Oluştur
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean

      - name: Gradlew Yetkisi Ver
        run: |
          cd android
          chmod +x gradlew

      - name: APK Derle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: GitHub Releases Üzerinde Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HeartBeat Release v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
